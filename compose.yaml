services:
  # --- Backend Layer ---
  # Local/Dev containerized backend (connects to sibling postgres & minio containers)
  backend:
    profiles: ["backend", "app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # Override host-oriented .env URLs for Docker-internal service networking
      DB_HOST: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-invoice_db}
      BLOB_ENDPOINT: http://minio:9000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-5173}}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend

  # Production containerized backend (uses external DB/S3 such as Supabase via .env.prod / .env)
  backend-prod:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
      - path: .env.prod
        required: false
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - backend

  # --- Frontend Layer ---
  frontend-dev:
    profiles: ["frontend", "app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      VITE_USE_POLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # keep the container's Linux node_modules
    depends_on:
      backend:
        condition: service_started
        required: false # don't fail when running backend outside Docker

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    env_file:
      - path: .env
        required: false
      - path: .env.prod
        required: false
    ports:
      - "${FRONTEND_PROD_PORT:-5173}:80"
    depends_on:
      backend-prod:
        condition: service_started
        required: false

  # --- Database Layer (unprofiled: always starts on `docker compose up -d`) ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-invoice_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Database Admin Layer ---
  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend

  # --- Object Storage Layer (S3-compatible MinIO for local dev) ---
  minio:
    image: public.ecr.aws/y9w4h2u9/minio:RELEASE.2025-09-07T16-13-09Z # Stable 2025 release
    ports:
      - "${MINIO_PORT:-9000}:9000" # MinIO API Port
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # MinIO Web Console Port
    environment:
      MINIO_ROOT_USER: ${BLOB_ACCESS_KEY:-minio_user}
      MINIO_ROOT_PASSWORD: ${BLOB_SECRET_KEY:-minio_password}
    volumes:
      - minio_data:/data
    command: server /data/buckets --console-address ":9001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:

# --- Custom network name for Docker ---
networks:
  backend:
    driver: bridge
