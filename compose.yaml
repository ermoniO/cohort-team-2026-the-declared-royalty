services:
  # --- Backend Layer ---
  # Runs only when the "backend" profile is enabled; omit it to run the backend locally
  backend:
    profiles: ["backend"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice-automation-backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      LLM_API_KEY: ${LLM_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend

  # --- Frontend Layer ---
  # Enable one via COMPOSE_PROFILES in .env (dev or prod); both use port 5173
  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: invoice-automation-frontend-dev
    environment:
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # keep the container's Linux node_modules
    depends_on:
      backend:
        condition: service_started
        required: false # don't fail when the backend profile is off

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: invoice-automation-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
        required: false # don't fail when the backend profile is off

  # --- Database Layer ---
  postgres:
    image: postgres:16-alpine
    container_name: invoice-automation-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Database Admin Layer ---
  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: invoice-automation-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend

  # --- Object Storage Layer (Blob) ---
  minio:
    image: public.ecr.aws/y9w4h2u9/minio:RELEASE.2025-09-07T16-13-09Z # Stable 2025 release
    container_name: invoice-blob-storage
    ports:
      - "9000:9000" # MinIO API Port
      - "9001:9001" # MinIO Web Console Port
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data/buckets --console-address ":9001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:

# --- Custom network name for Docker ---
networks:
  backend:
    driver: bridge