openapi: 3.0.3
info:
  title: Invoice Automation API
  description: Core API contract for managing properties, vendors, and invoice lifecycles.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server

paths:
  /api/v1/properties:
    get:
      summary: List all properties
      operationId: getProperties
      tags:
        - Properties
      responses:
        '200':
          description: A list of managed properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyResponse'

    post:
      summary: Create a new property
      operationId: createProperty
      tags:
        - Properties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreateRequest'
      responses:
        '201':
          description: Property created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'

  /api/v1/properties/{propertyId}:
    get:
      summary: Get property by ID
      operationId: getPropertyById
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Property found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '404':
          description: Property not found
  /api/v1/users:
    post:
      summary: Create a new user
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    get:
      summary: List all users
      operationId: getUsers
      tags:
        - Users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
  /api/v1/users/{userId}:
    get:
      summary: Get user by UserId
      operationId: getUserByUserId
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
    put:
      summary: Update user by UserId
      operationId: updateUserByUserId
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
    delete:
      summary: Deactivate a user by UserId
      operationId: deactivateUserByUserId
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deactivated successfully
        '404':
          description: User not found

components:
  schemas:
    PropertyCreateRequest:
      type: object
      required:
        - name
        - streetAddress
        - city
        - state
        - zipCode
      properties:
        name:
          type: string
          example: "Industrial Business Park"
        streetAddress:
          type: string
          example: "125 Industrial Way"
        city:
          type: string
          example: "Springfield"
        state:
          type: string
          example: "IL"
        zipCode:
          type: string
          example: "62701"

    PropertyResponse:
      type: object
      required:
        - propertyId
        - name
        - streetAddress
        - city
        - state
        - zipCode
        - status
      properties:
        propertyId:
          type: string
          format: uuid
        name:
          type: string
        streetAddress:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        status:
          type: string
          example: "ACTIVE"
    UserCreateRequest:
      type: object
      required:
        - username
        - email
      #        - password
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          default: "ADMIN"
        isActive:
          type: string
          default: "ACTIVE"
    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        isActive:
          type: string

    UserResponse:
      type: object
      required:
        - userId
        - createdAt
        - updatedAt
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
        isActive:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time