spring:
  application:
    name: invoice-automation-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: always

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

llm:
  api-key: ${LLM_API_KEY:-test-api-key}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_USER:minio_user}
  secret-key: ${MINIO_PASSWORD:minio_password}
  bucket: ${MINIO_BUCKET:invoices}