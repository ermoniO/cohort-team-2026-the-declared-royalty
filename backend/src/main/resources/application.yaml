server:
  port: ${BACKEND_PORT:${SERVER_PORT:${PORT:8080}}}

spring:
  application:
    name: invoice-automation-service

  datasource:
    url: ${DB_URL:${POSTGRES_URL:jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:localhost}}:${DB_PORT:${POSTGRES_PORT:5432}}/${DB_NAME:${POSTGRES_DB:invoice_db}}}}
    username: ${DB_USER:${POSTGRES_USER:postgres}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: always

frontend:
  url: ${FRONTEND_URL:http://localhost:${FRONTEND_PORT:5173}}

llm:
  api-key: ${LLM_API_KEY:-test-api-key}
  max-attempts: ${MAX_QUERY_ATTEMPTS_PER_CALL:-3}

blob-storage:
  endpoint: ${BLOB_ENDPOINT:http://localhost:${MINIO_PORT:9000}}
  access-key: ${BLOB_ACCESS_KEY:${BLOB_USER:minio_user}}
  secret-key: ${BLOB_SECRET_KEY:${BLOB_PASSWORD:minio_password}}
  bucket: ${BLOB_BUCKET:invoices}
  region: ${BLOB_REGION:us-east-1}

stripe:
  enabled: ${STRIPE_ENABLED:false}
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  currency: ${STRIPE_CURRENCY:usd}

app:
  seed:
    demo-invoices: ${DEMO_INVOICES_SEED_ENABLED:true}
