server:
  port: ${BACKEND_PORT:${SERVER_PORT:${PORT:8080}}}

spring:
  application:
    name: invoice-automation-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: always

frontend:
  url: ${FRONTEND_URL:http://localhost:${FRONTEND_PORT:5173}}

llm:
  api-key: ${LLM_API_KEY:-test-api-key}
  max-attempts: ${MAX_QUERY_ATTEMPTS_PER_CALL:-3}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:${MINIO_PORT:9000}}
  access-key: ${MINIO_USER:minio_user}
  secret-key: ${MINIO_PASSWORD:minio_password}
  bucket: ${MINIO_BUCKET:invoices}

stripe:
  enabled: ${STRIPE_ENABLED:false}
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  currency: ${STRIPE_CURRENCY:usd}
