  type: object
  properties:
    mappingUuid:
      type: string
      format: uuid
      description: New property-vendor mapping, if changing the association
      example: "f9e8d7c6-b5a4-3210-fedc-ba9876543210"
    invoiceStatus:
      $ref: './InvoiceStatus.yaml'
    billingPeriodStart:
      type: string
      format: date
    billingPeriodEnd:
      type: string
      format: date
    invoiceCreationDate:
      type: string
      format: date
    amount:
      type: number
      multipleOf: 0.01
      minimum: -99999999.99
      maximum: 99999999.99
    dueDate:
      type: string
      format: date
    failureReason:
      type: string
      maxLength: 2000
    blobFileUrl:
      type: string
      maxLength: 1000
    blobFileSha256:
      type: string
      maxLength: 100
      pattern: '^[A-Fa-f0-9]{64}$'
