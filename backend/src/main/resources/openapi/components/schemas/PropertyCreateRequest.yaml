type: object
required:
  - name
  - category
  - address
properties:
  name:
    type: string
    example: "Grandview Office Tower"
  category:
    type: string
    example: "COMMERCIAL_OFFICE"
  ownerEntity:
    type: string
    example: "Apex Holdings LLC"
  sqft:
    type: integer
    example: 720000
  address:
    $ref: './Address.yaml'
