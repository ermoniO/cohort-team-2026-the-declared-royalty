type: object
required:
  - vendorUuid
  - propertyUuid
  - vendorAccountNumber
  - amount
  - dueDate
properties:
  vendorUuid:
    type: string
    format: uuid
  propertyUuid:
    type: string
    format: uuid
  vendorAccountNumber:
    type: string
    minLength: 1
    maxLength: 100
  vendorSuppliedInvoiceId:
    type: string
    maxLength: 100
  amount:
    type: number
    multipleOf: 0.01
    minimum: -99999999.99
    maximum: 99999999.99
  dueDate:
    type: string
    format: date
  billingPeriodStart:
    type: string
    format: date
  billingPeriodEnd:
    type: string
    format: date
  invoiceCreationDate:
    type: string
    format: date
  notes:
    type: string
    maxLength: 2000
    description: What the reviewer changed from the AI's values; stored in the audit log
  aiValuesChanged:
    type: boolean
    default: false
    description: True when the reviewer changed any value the AI read. Logged as USER_IDENTIFIED instead of USER_VALIDATED.
  reviewedBy:
    type: string
    format: uuid
    description: >
      The user sending the invoice for approval; the audit entry is recorded under them.
      Omitted means the system user. An unknown user is rejected with 400.
      TODO(auth): take this from the session instead.