type: object
additionalProperties: false
properties:
  error:
    type: string
  extractedValues:
    type: object
    additionalProperties: false
#    To add a new field, add it to the properties section below and add it to the required list.
#    If the field is a string, use $ref: '#/$defs/StringField', if it is a number, use $ref: '#/$defs/NumberField'
    properties:
      vendor_name:
        $ref: '#/$defs/StringField'
      property_address:
        $ref: '#/$defs/StringField'
      property_name:
        $ref: '#/$defs/StringField'
      total_amount_due:
        $ref: '#/$defs/NumberField'
      payment_due_date:
        $ref: '#/$defs/StringField'
      invoice_number:
        $ref: '#/$defs/StringField'
      account_number:
        $ref: '#/$defs/StringField'
      billing_period_start:
        $ref: '#/$defs/StringField'
      billing_period_end:
        $ref: '#/$defs/StringField'
      invoice_issued_date:
        $ref: '#/$defs/StringField'
    required:
      - vendor_name
      - property_address
      - property_name
      - total_amount_due
      - payment_due_date
      - invoice_number
      - account_number
      - billing_period_start
      - billing_period_end
      - invoice_issued_date
required:
  - error
  - extractedValues

$defs:

  StringField:
    type: object
    additionalProperties: false
    properties:
      value:
        type:
          - string
          - "null"
      confidence:
        type: number
        minimum: 0
        maximum: 1
    required:
      - value
      - confidence

  NumberField:
    type: object
    additionalProperties: false
    properties:
      value:
        type:
          - number
          - "null"
      confidence:
        type: number
        minimum: 0
        maximum: 1
    required:
      - value
      - confidence