type: object
required:
  - propertyId
  - name
  - propertyType
  - address
  - status
properties:
  propertyId:
    type: string
    format: uuid
  name:
    type: string
    example: "Grandview Office Tower"
  propertyType:
    $ref: './PropertyType.yaml'
  address:
    $ref: './Address.yaml'
  status:
    type: string
    example: "ACTIVE"
