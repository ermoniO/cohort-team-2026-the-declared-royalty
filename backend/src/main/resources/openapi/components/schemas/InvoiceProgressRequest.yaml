type: object
description: >
  Values the reviewer has confirmed so far. Omitted fields are left as they are.
  vendorUuid, propertyUuid and vendorAccountNumber form the vendor/property link,
  so they're saved together, and only when all three are sent.
properties:
  vendorUuid:
    type: string
    format: uuid
  propertyUuid:
    type: string
    format: uuid
  vendorAccountNumber:
    type: string
    minLength: 1
    maxLength: 100
  vendorSuppliedInvoiceId:
    type: string
    maxLength: 100
  amount:
    type: number
    multipleOf: 0.01
    minimum: -99999999.99
    maximum: 99999999.99
  dueDate:
    type: string
    format: date
  billingPeriodStart:
    type: string
    format: date
  billingPeriodEnd:
    type: string
    format: date
  invoiceCreationDate:
    type: string
    format: date
  reviewedBy:
    type: string
    format: uuid
    description: >
      The user saving the review; the audit entry is recorded under them. Omitted means
      the system user. An unknown user is rejected with 400. Not counted as a confirmed field.
      TODO(auth): take this from the session instead.