type: object
required:
  - roleSlug
  - displayName
  - status
properties:
  roleSlug:
    type: string
    example: "SENIOR_PROPERTY_MANAGER"
  displayName:
    type: string
    example: "Senior Property Manager (SPM)"
  description:
    type: string
    example: "Manages flagship assets or regional complexes."
  status:
    type: string
    example: "ACTIVE"

