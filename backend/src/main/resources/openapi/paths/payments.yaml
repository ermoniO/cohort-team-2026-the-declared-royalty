get:
  tags:
    - Payments
  summary: List payments
  operationId: getPayments
  parameters:
    - name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: status
      in: query
      schema:
        type: array
        items:
          $ref: '../components/schemas/PaymentStatus.yaml'
    - name: q
      in: query
      schema:
        type: string
        maxLength: 100
  responses:
    '200':
      description: Payment queue
      content:
        application/json:
          schema:
            $ref: '../components/schemas/PaymentPageResponse.yaml'
