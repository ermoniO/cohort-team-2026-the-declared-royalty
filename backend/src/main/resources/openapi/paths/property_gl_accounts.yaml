get:
  summary: List property GL accounts
  description: Returns active General Ledger chart of accounts scoped to the specified property.
  tags:
    - Properties
  operationId: getPropertyGlAccounts
  parameters:
    - name: propertyId
      in: path
      required: true
      description: The UUID of the property
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: A list of active GL accounts for the property
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/PropertyGlAccountResponse.yaml'

