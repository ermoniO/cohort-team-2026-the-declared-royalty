# Strict: no defaults, so the app fails fast at startup if a variable is missing
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Keep the pool small; Render Postgres limits connections by instance size
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# validate = fail if the schema doesn't match the entities.
# Set JPA_DDL_AUTO=update on the first deploy if you have no migrations yet.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

# TLS ends at Render's edge and your app receives plain HTTP,
# so trust the forwarded headers when building URLs/redirects
server.forward-headers-strategy=framework

# Let in-flight requests finish during deploys
server.shutdown=graceful

logging.level.root=INFO