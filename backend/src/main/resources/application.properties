spring.application.name=invoice-automation-service

# Port: Render sets PORT (default 10000); locally falls back to 8080
server.port=${PORT:8080}

# Database: defaults point at a local Postgres
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invoice_automation_postgres}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Convenient for local development only; prod overrides this
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# CORS: frontend origin (Vite's default dev port locally)
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Actuator: expose only the health endpoint
management.endpoints.web.exposure.include=health